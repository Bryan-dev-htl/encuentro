<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malu  y  Javi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: un escenario panorámico con controles debajo, aspecto de libro ilustrado de día */
:root{
  --fondo:#eaf4ec; --tinta:#24343a; --boton:#2f6f5e; --boton-txt:#ffffff;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--body);
  padding-inline:16px;padding-block:24px;box-sizing:border-box;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;gap:16px}
h1{font-weight:800;font-size:1.6rem;margin:0;text-wrap:balance;text-align:center}
.escenario{width:100%;max-width:900px}
canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;box-shadow:0 12px 30px rgb(36 52 58 / .18)}
.controles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:700 1rem var(--body);background:var(--boton);color:var(--boton-txt);border:none;border-radius:999px;padding:10px 22px;cursor:pointer}
button:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
</style>

<h1>Malu y Javi</h1>
<div class="escenario"><canvas id="lienzo" aria-label="Dos personas caminan, se encuentran, se saludan y se van"></canvas></div>
<div class="controles">
  <button id="pausa">Pausar</button>
  <button id="reiniciar">Desde el inicio</button>
</div>

<script>
const cv = document.getElementById('lienzo');
const ctx = cv.getContext('2d');
let W, H;

// Ajusta el tamaño del dibujo al tamaño de la pantalla
function ajustar() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  W = r.width; H = r.height;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
ajustar();
addEventListener('resize', ajustar);

// Funciones de ayuda
const mezclar = (a, b, p) => a + (b - a) * p;
const limitar = (v) => Math.max(0, Math.min(1, v));
const suaveFin = (p) => 1 - (1 - p) * (1 - p);
const suaveInicio = (p) => p * p;
const aparecer = (t, desde, hasta) => limitar((t - desde) / 0.25) * limitar((hasta - t) / 0.25);

// ---------- Fondo ----------
function fondo(t, s, suelo) {
  const cielo = ctx.createLinearGradient(0, 0, 0, suelo);
  cielo.addColorStop(0, '#8fd0f7'); cielo.addColorStop(1, '#dff2fb');
  ctx.fillStyle = cielo; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffd45c';                       // sol
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.18, 30 * s, 0, 7); ctx.fill();

  ctx.fillStyle = '#ffffff';                       // nubes que se mueven despacio
  for (const [x0, y, k] of [[0.1, 0.16, 1], [0.5, 0.1, 0.8], [0.8, 0.3, 0.6]]) {
    const x = ((x0 * W + t * 12 * k * s) % (W + 160 * s)) - 80 * s;
    ctx.beginPath();
    ctx.ellipse(x, y * H, 40 * s * k, 14 * s * k, 0, 0, 7);
    ctx.ellipse(x + 22 * s * k, y * H - 9 * s * k, 24 * s * k, 14 * s * k, 0, 0, 7);
    ctx.fill();
  }

  ctx.fillStyle = '#a6dc96';                       // colinas
  ctx.beginPath(); ctx.ellipse(W * 0.25, suelo + 10 * s, W * 0.45, 90 * s, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#86cc7d';
  ctx.beginPath(); ctx.ellipse(W * 0.8, suelo + 10 * s, W * 0.4, 70 * s, 0, Math.PI, 0); ctx.fill();

  for (const fx of [0.12, 0.68, 0.93]) {           // árboles
    const x = W * fx;
    ctx.fillStyle = '#8a5a3b'; ctx.fillRect(x - 6 * s, suelo - 70 * s, 12 * s, 70 * s);
    ctx.fillStyle = '#4fa866';
    ctx.beginPath();
    ctx.arc(x, suelo - 90 * s, 34 * s, 0, 7);
    ctx.arc(x - 22 * s, suelo - 70 * s, 24 * s, 0, 7);
    ctx.arc(x + 22 * s, suelo - 72 * s, 24 * s, 0, 7);
    ctx.fill();
  }

  ctx.fillStyle = '#e8d3a2'; ctx.fillRect(0, suelo, W, H - suelo);   // camino
  ctx.fillStyle = '#6fbf6a'; ctx.fillRect(0, suelo - 4 * s, W, 6 * s);
}

// ---------- Persona ----------
// dir: 1 mira a la derecha, -1 mira a la izquierda
// paso: fase de la caminata, mov: cuánto mueve las piernas (0 a 1), saludo: brazo levantado (0 a 1)
function persona(x, dir, paso, mov, saludo, t, s, suelo, c) {
  const rebote = -Math.abs(Math.sin(paso)) * 3 * s * mov;
  const cadera = suelo - 62 * s + rebote;
  const hombro = cadera - 50 * s;
  const cabeza = hombro - 24 * s;
  const balanceo = Math.sin(paso) * 0.45 * mov;

  function extremidad(x0, y0, angulo, largo, grosor, color, punta, colorPunta) {
    const x1 = x0 + Math.sin(angulo) * largo * dir;
    const y1 = y0 + Math.cos(angulo) * largo;
    ctx.strokeStyle = color; ctx.lineWidth = grosor; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.fillStyle = colorPunta; ctx.beginPath(); ctx.arc(x1, y1, punta, 0, 7); ctx.fill();
  }

  // sombra
  ctx.fillStyle = 'rgba(60,40,20,.18)';
  ctx.beginPath(); ctx.ellipse(x, suelo + 2 * s, 26 * s, 6 * s, 0, 0, 7); ctx.fill();

  // brazo y pierna de atrás (más oscuros)
  extremidad(x, hombro + 4 * s, balanceo * 0.9, 44 * s, 9 * s, c.camisaSombra, 5 * s, c.pielSombra);
  extremidad(x, cadera, -balanceo, 60 * s, 11 * s, c.pantalonSombra, 6 * s, '#3a2c2c');

  // pelo largo detrás de la cabeza
  if (c.peloLargo) {
    ctx.fillStyle = c.pelo;
    ctx.beginPath(); ctx.roundRect(x - 18 * s - 4 * s * dir, cabeza - 6 * s, 36 * s, 40 * s, 12 * s); ctx.fill();
  }

  // cuerpo
  ctx.fillStyle = c.camisa;
  ctx.beginPath(); ctx.roundRect(x - 17 * s, hombro - 6 * s, 34 * s, cadera - hombro + 14 * s, 12 * s); ctx.fill();

  // pierna de adelante
  extremidad(x, cadera, balanceo, 60 * s, 11 * s, c.pantalon, 6 * s, '#3a2c2c');

  // cabeza
  ctx.fillStyle = c.piel;
  ctx.beginPath(); ctx.arc(x, cabeza, 17 * s, 0, 7); ctx.fill();
  ctx.fillStyle = c.pelo;
  ctx.beginPath(); ctx.arc(x - 2 * s * dir, cabeza - 3 * s, 17 * s, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();

  // cara
  ctx.fillStyle = '#24343a';
  ctx.beginPath(); ctx.arc(x + 7 * s * dir, cabeza - 1 * s, 2.2 * s, 0, 7); ctx.fill();
  ctx.strokeStyle = '#24343a'; ctx.lineWidth = 1.8 * s;
  const sonrisa = 4 * s + saludo * 2 * s;          // sonríe más al saludar
  ctx.beginPath(); ctx.arc(x + 8 * s * dir, cabeza + 4 * s, sonrisa, 0.3, Math.PI - 0.3); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,.35)';
  ctx.beginPath(); ctx.arc(x + 3 * s * dir, cabeza + 5 * s, 3.5 * s, 0, 7); ctx.fill();

  // brazo de adelante: camina o saluda moviendo la mano
  const anguloSaludo = 2.55 + Math.sin(t * 14) * 0.35;
  const anguloBrazo = mezclar(-balanceo * 0.9, anguloSaludo, saludo);
  extremidad(x, hombro + 4 * s, anguloBrazo, 44 * s, 9 * s, c.camisa, 5.5 * s, c.piel);
}

// ---------- Globo de diálogo ----------
function globo(x, y, texto, alfa, s) {
  if (alfa <= 0) return;
  ctx.save();
  ctx.globalAlpha = alfa;
  ctx.font = `800 ${16 * s}px Nunito, system-ui, sans-serif`;
  const ancho = ctx.measureText(texto).width + 22 * s;
  const alto = 32 * s;
  const subida = (1 - alfa) * 8 * s;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#24343a'; ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.roundRect(x - ancho / 2, y - alto - 10 * s + subida, ancho, alto, 12 * s);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();                                  // colita del globo
  ctx.moveTo(x - 6 * s, y - 10.5 * s + subida); ctx.lineTo(x, y + subida); ctx.lineTo(x + 6 * s, y - 10.5 * s + subida);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#24343a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(texto, x, y - alto / 2 - 10 * s + subida);
  ctx.restore();
}

// ---------- Colores de cada persona ----------
const ana  = { camisa:'#ff7a6b', camisaSombra:'#d95b4e', pantalon:'#3d5a99', pantalonSombra:'#2c4378',
               piel:'#f2c29b', pielSombra:'#d9a47c', pelo:'#5b3a29', peloLargo:true };
const luis = { camisa:'#ffc94a', camisaSombra:'#e0a92c', pantalon:'#4b4b5e', pantalonSombra:'#35354a',
               piel:'#a8724f', pielSombra:'#8c5c3d', pelo:'#1f1a1a', peloLargo:false };

// ---------- La historia (dura 12 segundos y se repite) ----------
const DURACION = 12;
function dibujar(tiempo) {
  const t = tiempo % DURACION;
  const s = H / 360;
  const suelo = H * 0.84;
  fondo(tiempo, s, suelo);

  const inicioA = -60 * s, inicioB = W + 60 * s;
  const encuentroA = W / 2 - 48 * s, encuentroB = W / 2 + 48 * s;
  let xA, xB, dirA, dirB, mov, saludoA = 0, saludoB = 0;

  if (t < 4) {                       // 1. caminan hacia el centro
    const p = suaveFin(t / 4);
    xA = mezclar(inicioA, encuentroA, p); xB = mezclar(inicioB, encuentroB, p);
    dirA = 1; dirB = -1; mov = limitar((4 - t) / 0.7);
  } else if (t < 7.4) {              // 2. se detienen y se saludan
    xA = encuentroA; xB = encuentroB; dirA = 1; dirB = -1; mov = 0;
    saludoA = limitar((t - 4.2) / 0.4) * limitar((6.8 - t) / 0.4);
    saludoB = limitar((t - 4.9) / 0.4) * limitar((7.2 - t) / 0.4);
  } else if (t < 11.2) {             // 3. se dan la vuelta y se van
    const p = suaveInicio((t - 7.4) / 3.8);
    xA = mezclar(encuentroA, inicioA, p); xB = mezclar(encuentroB, inicioB, p);
    dirA = -1; dirB = 1; mov = limitar((t - 7.4) / 0.5);
  } else {                           // 4. escena vacía un momento
    xA = inicioA; xB = inicioB; dirA = -1; dirB = 1; mov = 0;
  }

  const paso = t * 9;
  persona(xA, dirA, paso, mov, saludoA, tiempo, s, suelo, ana);
  persona(xB, dirB, paso + Math.PI, mov, saludoB, tiempo, s, suelo, luis);

  const alturaGlobo = suelo - 175 * s;
  globo(xA - 18 * s, alturaGlobo, '¡Hola!', aparecer(t, 4.3, 5.9), s);
  globo(xB + 18 * s, alturaGlobo, '¡Hola! ¿Qué tal?', aparecer(t, 5.1, 6.7), s);
  globo(xA - 18 * s, alturaGlobo, '¡Nos vemos!', aparecer(t, 6.8, 8.0), s);
  globo(xB + 18 * s, alturaGlobo, '¡Chao!', aparecer(t, 7.0, 8.2), s);
}

// ---------- Reproducción ----------
let tiempo = 0, ultimo = performance.now(), reproduciendo = true;
function cuadro(ahora) {
  if (reproduciendo) tiempo += (ahora - ultimo) / 1000;
  ultimo = ahora;
  dibujar(tiempo);
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);

const botonPausa = document.getElementById('pausa');
botonPausa.addEventListener('click', () => {
  reproduciendo = !reproduciendo;
  botonPausa.textContent = reproduciendo ? 'Pausar' : 'Reproducir';
});
document.getElementById('reiniciar').addEventListener('click', () => {
  tiempo = 0; reproduciendo = true; botonPausa.textContent = 'Pausar';
});
</script>
</html>
